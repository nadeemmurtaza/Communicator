syntax = "proto3";

package newax.embed_widget.v1;

service EmbedWidgetService {
  rpc GetSummary(Empty) returns (JsonResponse);
  rpc ListConfigs(ListConfigsRequest) returns (JsonResponse);
  rpc GetConfig(IdRequest) returns (JsonResponse);
  rpc CreateConfig(CreateConfigRequest) returns (JsonResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (JsonResponse);
  rpc DeleteConfig(IdRequest) returns (Empty);
  rpc GetSettings(OrgRequest) returns (JsonResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (JsonResponse);
  rpc RecordEvent(RecordEventRequest) returns (JsonResponse);
  rpc GetEvents(GetEventsRequest) returns (JsonResponse);
  rpc GetPublicWidgetData(IdRequest) returns (JsonResponse);
  rpc GetEmbedScript(IdRequest) returns (JsonResponse);
}

message Empty {}

message IdRequest {
  string id = 1;
}

message OrgRequest {
  string org_id = 1;
}

message ListConfigsRequest {
  string org_id = 1;
  optional string status = 2;
}

message CreateConfigRequest {
  string org_id = 1;
  string name = 2;
  string widget_type = 3;
  string settings_json = 4;
  string styles_json = 5;
  string trigger_config_json = 6;
}

message UpdateConfigRequest {
  string id = 1;
  string updates_json = 2;
}

message UpdateSettingsRequest {
  string org_id = 1;
  string updates_json = 2;
}

message RecordEventRequest {
  string instance_id = 1;
  string event_type = 2;
  string payload_json = 3;
}

message GetEventsRequest {
  optional string instance_id = 1;
  optional string event_type = 2;
  int64 limit = 3;
}

// Pragmatic envelope for dynamically-shaped payloads, same convention as
// kb_documents.proto/system_health.proto.
message JsonResponse {
  string json = 1;
}
