syntax = "proto3";

package newax.scheduled_tasks.v1;

service ScheduledTasksService {
  rpc GetSummary(Empty) returns (SchedulerSummary);
  rpc ListTasks(ListTasksRequest) returns (TaskList);
  rpc GetTask(TaskIdRequest) returns (ScheduledTask);
  rpc CreateTask(CreateTaskRequest) returns (ScheduledTask);
  rpc UpdateTask(UpdateTaskRequest) returns (ScheduledTask);
  rpc DeleteTask(TaskIdRequest) returns (Empty);
  rpc TriggerTask(TaskIdRequest) returns (TriggerResult);
  rpc ProcessQueue(Empty) returns (StringList);
  rpc ListRuns(ListRunsRequest) returns (TaskRunList);
  rpc ListQueue(ListQueueRequest) returns (TaskQueueList);
  rpc GetSettings(Empty) returns (SchedulerSettings);
  rpc UpdateSettings(SchedulerSettings) returns (SchedulerSettings);
  rpc CleanupOldLogs(CleanupRequest) returns (CleanupResult);
  rpc GetTaskTypes(Empty) returns (StringList);
}

message Empty {}

message TaskIdRequest {
  string task_id = 1;
}

message ListTasksRequest {
  bool active_only = 1;
  optional string task_type = 2;
}

message ListRunsRequest {
  optional string task_id = 1;
  optional string status = 2;
  int64 limit = 3;
}

message ListQueueRequest {
  optional string status = 1;
}

message CleanupRequest {
  int32 retention_days = 1;
}

message ScheduledTask {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string task_type = 4;
  string cron_schedule = 5;
  optional string next_run_at = 6;
  bool is_active = 7;
  string config = 8;
  string created_at = 9;
  string updated_at = 10;
}

message TaskRun {
  string id = 1;
  string task_id = 2;
  string started_at = 3;
  optional string completed_at = 4;
  string status = 5;
  optional int64 duration_ms = 6;
  optional string result = 7;
  optional string error_message = 8;
  int64 records_processed = 9;
}

message TaskQueueEntry {
  string id = 1;
  string task_id = 2;
  string triggered_by = 3;
  string triggered_at = 4;
  string status = 5;
  optional string completed_at = 6;
  optional string error_message = 7;
}

message SchedulerSettings {
  string id = 1;
  string org_id = 2;
  bool enabled = 3;
  int32 max_concurrent_tasks = 4;
  int32 task_timeout_seconds = 5;
  bool retry_failed = 6;
  int32 retry_count = 7;
  int32 retry_delay_seconds = 8;
  int32 log_retention_days = 9;
  optional string webhook_url = 10;
  string created_at = 11;
  string updated_at = 12;
}

message CreateTaskRequest {
  string name = 1;
  optional string description = 2;
  string task_type = 3;
  string cron_schedule = 4;
  optional string config_json = 5;
}

message UpdateTaskRequest {
  string task_id = 1;
  optional string description = 2;
  optional string task_type = 3;
  optional string cron_schedule = 4;
  optional bool is_active = 5;
  optional string config_json = 6;
}

message TaskTypeCount {
  string task_type = 1;
  int64 count = 2;
}

message SchedulerSummary {
  int64 total_tasks = 1;
  int64 active_tasks = 2;
  int64 pending_queue = 3;
  int64 total_runs = 4;
  int64 successful_runs = 5;
  int64 failed_runs = 6;
  bool scheduler_enabled = 7;
  repeated TaskTypeCount task_type_breakdown = 8;
  repeated TaskRun recent_runs = 9;
}

message TriggerResult {
  string queue_id = 1;
  string task_name = 2;
  string message = 3;
}

message CleanupResult {
  int64 deleted_runs = 1;
  int64 deleted_queue = 2;
  string message = 3;
}

message TaskList {
  repeated ScheduledTask tasks = 1;
}

message TaskRunList {
  repeated TaskRun runs = 1;
}

message TaskQueueList {
  repeated TaskQueueEntry entries = 1;
}

message StringList {
  repeated string values = 1;
}
