syntax = "proto3";

package newax.crm_sync.v1;

service CRMSyncService {
  rpc GetSummary(Empty) returns (JsonResponse);
  rpc GetProviders(Empty) returns (JsonResponse);
  rpc ListConnections(ListConnectionsRequest) returns (JsonResponse);
  rpc CreateConnection(CreateConnectionRequest) returns (JsonResponse);
  rpc UpdateConnection(UpdateConnectionRequest) returns (JsonResponse);
  rpc DeleteConnection(IdRequest) returns (JsonResponse);
  rpc TriggerSync(TriggerSyncRequest) returns (JsonResponse);
  rpc ListSyncLogs(ListSyncLogsRequest) returns (JsonResponse);
  rpc ListFieldMappings(ListFieldMappingsRequest) returns (JsonResponse);
  rpc GetExternalRefs(GetExternalRefsRequest) returns (JsonResponse);
  rpc CreateExternalRef(CreateExternalRefRequest) returns (JsonResponse);
}

message Empty {}

message JsonResponse {
  string json = 1;
}

message IdRequest {
  string id = 1;
}

message ListConnectionsRequest {
  optional string provider = 1;
  optional string status = 2;
}

message CreateConnectionRequest {
  string organization_id = 1;
  string provider = 2;
  string auth_type = 3;
  optional string credentials = 4;
  optional string config = 5;
}

message UpdateConnectionRequest {
  string id = 1;
  string status = 2;
  optional string credentials = 3;
  optional string last_error = 4;
}

message TriggerSyncRequest {
  string connection_id = 1;
  string direction = 2;
  string object_type = 3;
}

message ListSyncLogsRequest {
  optional string connection_id = 1;
  int32 limit = 2;
}

message ListFieldMappingsRequest {
  optional string connection_id = 1;
  optional string object_type = 2;
}

message GetExternalRefsRequest {
  string local_type = 1;
  string local_id = 2;
}

message CreateExternalRefRequest {
  string connection_id = 1;
  string local_type = 2;
  string local_id = 3;
  string crm_object_type = 4;
  string crm_record_id = 5;
  optional string crm_record_url = 6;
}
