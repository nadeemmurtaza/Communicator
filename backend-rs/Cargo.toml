[package]
name = "backend-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework & HTTP
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "timeout"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-native-tls = "0.3"

# Database (PostgreSQL only — shared with nID)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }

# Serialization & Models
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.11"

# Security & Webhooks (HMAC-SHA256 for Meta / TikTok)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"

# Environment & Logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
base64 = "0.23.1"
aes-gcm = "0.10"
async-trait = "0.1"

# Document processing (Phase 23)
lopdf = "0.42"
zip = "2.2"

# Random (A/B testing traffic splits, OTP generation)
rand = "0.8"

# Unique IDs for external integrations
nanoid = "0.4"

# Error handling
anyhow = "1"
