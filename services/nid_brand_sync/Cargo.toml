[package]
name = "svc-nid-brand-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
newax-proto = { path = "../../crates/proto" }
nid_brand_sync = { path = "../../crates/nid_brand_sync" }

[build-dependencies]
tonic-build = "0.12"
