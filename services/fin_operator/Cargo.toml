[package]
name = "svc-fin-operator"
version = "0.1.0"
edition = "2021"

[dependencies]
fin_operator = { path = "../../crates/fin_operator" }
tonic = "0.10"
prost = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.10"
