[package]
name = "svc-kb-documents"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-kb-documents"
path = "src/main.rs"

[dependencies]
newax-kb-documents = { path = "../../crates/kb-documents" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.12"
