[package]
name = "svc-team-routing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-team-routing"
path = "src/main.rs"

[dependencies]
newax-team-routing = { path = "../../crates/team_routing" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
