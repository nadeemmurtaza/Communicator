[package]
name = "svc-csat-surveys"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-csat-surveys = { path = "../../crates/csat_surveys" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
