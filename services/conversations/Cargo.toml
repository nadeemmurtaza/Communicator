[package]
name = "svc-conversations"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-conversations"
path = "src/main.rs"

[dependencies]
newax-conversations = { path = "../../crates/conversations" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
