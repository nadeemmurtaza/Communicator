[package]
name = "svc-shopify-store"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-shopify-store"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
newax-proto = { path = "../../crates/proto" }
newax-shopify-store-integration = { path = "../../crates/shopify_store_integration" }

[build-dependencies]
tonic-build = "0.12"
