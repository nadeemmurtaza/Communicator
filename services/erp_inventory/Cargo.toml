[package]
name = "svc-erp-inventory"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-erp-inventory = { path = "../../crates/erp_inventory" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
anyhow = "1"
env_logger = "0.11"

[build-dependencies]
tonic-build = "0.12"
