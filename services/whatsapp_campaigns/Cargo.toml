[package]
name = "svc-whatsapp-campaigns"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-whatsapp-campaigns"
path = "src/main.rs"

[dependencies]
newax-whatsapp-campaigns = { path = "../../crates/whatsapp_campaigns" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"
