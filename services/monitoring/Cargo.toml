[package]
name = "svc-monitoring"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-monitoring"
path = "src/main.rs"

[dependencies]
newax-monitoring = { path = "../../crates/monitoring" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.12"
