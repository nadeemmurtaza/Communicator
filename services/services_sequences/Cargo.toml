[package]
name = "svc-services-sequences"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-services-sequences"
path = "src/main.rs"

[dependencies]
newax-services-sequences = { path = "../../crates/services_sequences" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.12"
