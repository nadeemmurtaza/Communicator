[package]
name = "svc-unified-analytics"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-unified-analytics"
path = "src/main.rs"

[dependencies]
newax-unified-analytics = { path = "../../crates/unified_analytics" }
serde = { version = "1", features = ["derive"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.12"
