[package]
name = "svc-otp-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-otp-engine = { path = "../../crates/otp_engine" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }

[build-dependencies]
tonic-build = "0.12"
