[package]
name = "svc-whatsapp-automations"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-whatsapp-automations"
path = "src/main.rs"

[dependencies]
newax-whatsapp-automations = { path = "../../crates/whatsapp_automations" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
