[package]
name = "svc-external-otp"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-external-otp = { path = "../../crates/external_otp" }
newax-proto = { path = "../../crates/proto" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
