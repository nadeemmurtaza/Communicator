[package]
name = "svc-fin-vision"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
anyhow = "1"
fin_vision = { path = "../../crates/fin_vision" }
newax-proto = { path = "../../crates/proto" }

[build-dependencies]
tonic-build = "0.12"
