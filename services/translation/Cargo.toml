[package]
name = "svc-translation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-translation"
path = "src/main.rs"

[dependencies]
newax-translation = { path = "../../crates/translation" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
