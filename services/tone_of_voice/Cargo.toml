[package]
name = "svc-tone-of-voice"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-tone-of-voice"
path = "src/main.rs"

[dependencies]
newax-tone-of-voice = { path = "../../crates/tone_of_voice" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.12"
