[package]
name = "svc-organization"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-organization = { path = "../../crates/organization" }
newax-proto = { path = "../../crates/proto" }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
