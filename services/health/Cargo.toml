[package]
name = "svc-health"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-health"
path = "src/main.rs"

[dependencies]
newax-health = { path = "../../crates/health" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
