[package]
name = "svc-omni-broadcast"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-omni-broadcast = { path = "../../crates/omni_broadcast" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"
