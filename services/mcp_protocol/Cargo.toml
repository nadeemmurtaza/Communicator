[package]
name = "svc-mcp-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-mcp-protocol = { path = "../../crates/mcp_protocol" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
