[package]
name = "svc-sso"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-sso"
path = "src/main.rs"

[dependencies]
newax-proto = { path = "../../crates/proto" }
newax-sso = { path = "../../crates/sso" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
