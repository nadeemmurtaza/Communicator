[package]
name = "svc-erp-fulfilment"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-erp-fulfilment = { path = "../../crates/erp_fulfilment" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"
