[package]
name = "svc-nid-organization-sync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-nid-organization-sync"
path = "src/main.rs"

[dependencies]
newax-proto = { path = "../../crates/proto" }
newax-nid-organization-sync = { path = "../../crates/nid_organization_sync" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
serde_json = "1"
anyhow = "1"
env_logger = "0.11"

[build-dependencies]
tonic-build = "0.12"
