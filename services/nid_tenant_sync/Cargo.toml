[package]
name = "svc-nid-tenant-sync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc-nid-tenant-sync"
path = "src/main.rs"

[dependencies]
newax-nid-tenant-sync = { path = "../../crates/nid_tenant_sync" }
newax-proto = { path = "../../crates/proto" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[build-dependencies]
tonic-build = "0.12"
