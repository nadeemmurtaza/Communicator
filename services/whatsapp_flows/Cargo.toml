[package]
name = "svc-whatsapp-flows"
version = "0.1.0"
edition = "2021"

[dependencies]
newax-whatsapp-flows = { path = "../../crates/whatsapp_flows" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
