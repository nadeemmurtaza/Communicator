name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Uses Semgrep's free community/registry rulesets (p/default,
      # language-specific packs auto-selected) -- no SEMGREP_APP_TOKEN or
      # login required. Findings are report-only for now (the scan step
      # doesn't fail the build); once the initial findings are triaged,
      # tighten this to fail on new high-severity results.
      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
