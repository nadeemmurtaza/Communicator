name: Qodo AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  qodo_review:
    # Only run on pull requests, or on comments if the comment is explicitly on a pull request
    # and authored by a repository owner, member, or collaborator (prevents unauthorized secret-bearing executions).
    if: >
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    name: Qodo Code Review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qodo PR Agent
        uses: the-pr-agent/pr-agent@6de02f5036ce9b250222f8be65f42a20694ff972
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
