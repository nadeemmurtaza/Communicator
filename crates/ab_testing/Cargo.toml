[package]
name = "newax-ab-testing"
version = "0.1.0"
edition = "2021"

[lib]
name = "newax_ab_testing"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
anyhow = "1"
