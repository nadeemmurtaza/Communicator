[package]
name = "newax-kb-documents"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.11"
uuid = { version = "1", features = ["v4", "serde"] }
