[package]
name = "newax-shopify-store-integration"
version = "0.1.0"
edition = "2021"

[lib]
name = "newax_shopify_store_integration"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
nanoid = "0.4"
newax-otp-engine = { path = "../otp_engine" }
