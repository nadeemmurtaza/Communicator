[package]
name = "newax-identity-sync"
version = "0.1.0"
edition = "2021"
description = "Subscribes to nID's tenant/organization/brand/customer identity events over NATS JetStream and keeps this repo's synced read-model current. See lib.rs doc comment — COMMUNICATION.md's event-bus mandate, nID owns these IDs, this repo never treats its copy as authoritative."

[lib]
name = "newax_identity_sync"
path = "src/lib.rs"

[dependencies]
async-nats = "0.38"
prost = "0.13"
newax-proto = { path = "../proto" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
futures = "0.3"
