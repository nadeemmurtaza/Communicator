[package]
name = "newax-nid-organization-sync"
version = "0.1.0"
edition = "2021"

[lib]
name = "newax_nid_organization_sync"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rand = "0.8"
hex = "0.4"
urlencoding = "2"
